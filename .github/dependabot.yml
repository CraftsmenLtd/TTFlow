version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; revisit when it supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
